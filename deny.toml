# cargo-deny (https://embarkstudios.github.io/cargo-deny/): the licence and
# supply-chain gate of the open library. CI runs `cargo deny check` on the
# root crate and on each published crate (.github/workflows/ci.yml).
#
# The allow-list is permissive licences only, plus MPL-2.0 (file-level
# copyleft: it applies to the MPL files themselves, never to the combined
# work). No GPL/LGPL/AGPL: a crate offering one of those *alongside* a
# permissive arm (e.g. `Apache-2.0 OR GPL-2.0-only`) passes on that arm.

[graph]
all-features = false
# The targets the library ships for: desktop macOS, iOS, the browser.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-apple-ios",
    "wasm32-unknown-unknown",
]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    # libbz2-rs-sys (via zip/parquet): the bzip2 licence, BSD-style permissive.
    "bzip2-1.0.6",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "OFL-1.1",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]
# This repository's own crates are `MIT OR Apache-2.0` (both allowed above);
# unpublished ones (kit, the shells, tools) need no licence check.
[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
# Path dependencies inside this repository have no version.
allow-wildcard-paths = true

[advisories]
version = 2
yanked = "warn"
# Each ignore names the crate that brings the advisory in and why it does
# not reach this library's users. Our own direct dependencies carry no
# advisory: fix those by upgrading, never by adding a line here.
ignore = [
    # Unmaintained, and only inside GPUI, which this library is built on:
    # they go when GPUI replaces them.
    { id = "RUSTSEC-2024-0384", reason = "instant: unmaintained; via gpui-base" },
    { id = "RUSTSEC-2024-0436", reason = "paste: unmaintained proc-macro; via gpui-component and rav1e" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile: unmaintained; via gpui-pre-reqwest" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser: unmaintained; via fontdb (GPUI's and usvg's font loading)" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz: unmaintained; via usvg (GPUI's SVG icons)" },
    { id = "RUSTSEC-2026-0374", reason = "basic-toml: unmaintained; build-time only, via the askama_derive proc-macro" },
    # lru < 0.18.2 frees a node before unlinking it when a key's Drop
    # panics in pop(). Our own lru is 0.18; glyphon 0.12 still holds 0.16
    # with plain-data glyph keys, whose Drop cannot panic.
    { id = "RUSTSEC-2026-0253", reason = "lru 0.16 via glyphon; its keys' Drop cannot panic" },
    # Unmaintained; serde_yaml is used only by an unpublished in-repo tool
    # crate, never by the library or its published crates.
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml via serde_yaml in an unpublished tool crate" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies: the examples' agentic HTTP surface lives in this
# repository (`gpui-agentic-http/`).
allow-git = []
