# Task 0's allocation-pooling baseline: `mvt::decode`, `match_tile_static`,
# `resolve_plan`, and `tessellate_plan_with_ranges`, timed separately
# against one real z14 Singapore tile plus allocation counts from a
# `#[global_allocator]` shim. `harness = false` because `benches/perf.rs`
# defines its own `main` (not the default `libtest` harness, and not
# `criterion_main!` either -- it runs the allocation report first, then
# hands off to criterion for timing). That `#[global_allocator]` only takes
# effect inside THIS bench binary's own process (a separate crate from the
# library), never in the lib, an example, or `cargo test`. See the module
# doc comment in `benches/perf.rs`.
[[bench]]
name = "perf"
harness = false


